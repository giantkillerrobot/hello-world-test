<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World test two — Main</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0b1020;
      color: #f5f7ff;
    }
    main { text-align: center; padding: 2rem; }
    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: #22c55e;
      color: #052e16;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin: 0 0 0.75rem;
      letter-spacing: -0.03em;
    }
    p { margin: 0; opacity: 0.75; font-size: 1.1rem; }
    .version {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">main · production</div>
    <h1>Hello World test two</h1>
    <p>Deployed from the <code>main</code> branch.</p>
  </main>
  <div class="version">v1.0.0</div>
</body>
</html>
