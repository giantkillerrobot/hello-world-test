<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World Test — Dev</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: #1a1025;
      color: #f5f7ff;
    }
    main { text-align: center; padding: 2rem; }
    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: #a78bfa;
      color: #2e1065;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin: 0 0 0.75rem;
      letter-spacing: -0.03em;
    }
    p { margin: 0; opacity: 0.75; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <div class="badge">dev · preview</div>
    <h1>Hello World Test</h1>
    <p>Deployed from the <code>dev</code> branch.</p>
  </main>
</body>
</html>
