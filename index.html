<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World test two — Main</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0b1020;
      color: #f5f7ff;
    }
    main { text-align: center; padding: 2rem; }
    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: #22c55e;
      color: #052e16;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin: 0 0 0.75rem;
      letter-spacing: -0.03em;
    }
    p { margin: 0; opacity: 0.75; font-size: 1.1rem; }
    .version {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      opacity: 0.45;
    }
    #gate {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0b1020;
      z-index: 10;
    }
    #gate.hidden { display: none; }
    #app.hidden { display: none; }
    .gate-box { text-align: center; padding: 2rem; width: min(22rem, 90vw); }
    .gate-box h2 {
      margin: 0 0 1rem;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    .gate-box form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .gate-box input {
      padding: 0.7rem 0.85rem;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      background: #111827;
      color: #f5f7ff;
      font-size: 1rem;
    }
    .gate-box button {
      padding: 0.7rem 0.85rem;
      border: 0;
      border-radius: 0.5rem;
      background: #22c55e;
      color: #052e16;
      font-weight: 600;
      cursor: pointer;
    }
    .error {
      min-height: 1.25rem;
      margin: 0.5rem 0 0;
      color: #f87171;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="gate">
    <div class="gate-box">
      <h2>Enter password</h2>
      <form id="auth-form">
        <input id="password" type="password" autocomplete="current-password" placeholder="Password" />
        <button type="submit">Continue</button>
      </form>
      <p class="error" id="error"></p>
    </div>
  </div>
  <div id="app" class="hidden">
    <main>
      <div class="badge">main · production</div>
      <h1>Hello World test two</h1>
      <p>Deployed from the <code>main</code> branch.</p>
    </main>
    <div class="version">v1.1.0</div>
  </div>
  <script>
    const KEY = "hw-auth";
    const gate = document.getElementById("gate");
    const app = document.getElementById("app");
    const error = document.getElementById("error");

    function unlock() {
      gate.classList.add("hidden");
      app.classList.remove("hidden");
    }

    if (sessionStorage.getItem(KEY) === "1") unlock();

    document.getElementById("auth-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const value = document.getElementById("password").value;
      if (value === "helloworld") {
        sessionStorage.setItem(KEY, "1");
        unlock();
      } else {
        error.textContent = "Wrong password";
      }
    });
  </script>
</body>
</html>
